/* Layout: colonna unica, scala della carriera con rail degli anni a sinistra,
   barra di gioco ancorata in basso. Due pelli: carta sportiva e notte. */
:root{
  --bg:#F6EDE6;
  --surface:#FFFBF8;
  --surface-2:#EDE0D7;
  --ink:#16211F;
  --ink-soft:#6A7772;
  --line:#DCC9BC;
  --accent:#0E5C4A;
  --accent-ink:#FFFFFF;
  --hot:#C8305B;
  --ok:#1F7A4D;
  --warn:#9A6514;
  --shadow:0 1px 2px rgba(22,33,31,.08), 0 8px 24px -12px rgba(22,33,31,.22);
  --glow:none;

  --font-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'Newsreader',Georgia,'Times New Roman',serif;
  --font-data:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Notte: blu-nero profondo, come Higher or Lower. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070910;
    --surface:#0F1320;
    --surface-2:#161B2C;
    --ink:#E9EBF5;
    --ink-soft:#8891AB;
    --line:#222942;
    --accent:#3DDC97;
    --accent-ink:#04140C;
    --hot:#FF6B8A;
    --ok:#3DDC97;
    --warn:#F0B429;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.9);
    --glow:0 0 0 1px rgba(61,220,151,.14), 0 0 28px -10px rgba(61,220,151,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070910;
  --surface:#0F1320;
  --surface-2:#161B2C;
  --ink:#E9EBF5;
  --ink-soft:#8891AB;
  --line:#222942;
  --accent:#3DDC97;
  --accent-ink:#04140C;
  --hot:#FF6B8A;
  --ok:#3DDC97;
  --warn:#F0B429;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.9);
  --glow:0 0 0 1px rgba(61,220,151,.14), 0 0 28px -10px rgba(61,220,151,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 132px}

/* Testata */
.masthead{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
  padding-block:14px 12px; margin-bottom:20px;
}
.brandline{flex:1;min-width:0;padding-right:4px}
.kicker{
  font-family:var(--font-ui); font-size:10px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--hot);
}
.wordmark{
  margin:2px 0 0; font-family:var(--font-display);
  font-variation-settings:'wdth' 118; font-weight:800;
  font-size:clamp(18px,5.2vw,30px); line-height:1; letter-spacing:-.015em;
  text-transform:uppercase; text-wrap:balance;
}
.iconbtn{
  display:grid;place-items:center;width:36px;height:36px;flex:none;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
}
@media (max-width:420px){.iconbtn{width:32px;height:32px}}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.acceso{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* Selettori */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.segment{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.segment button{
  border:0;background:transparent;border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  letter-spacing:.01em;white-space:nowrap;
}
.segment button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Intestazione di sezione */
.sectionhead{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--ink);
}
.sectionhead h2{
  margin:0;font-family:var(--font-display);font-variation-settings:'wdth' 112;
  font-weight:800;font-size:13px;letter-spacing:.11em;text-transform:uppercase;
}
.sectionhead span{font-family:var(--font-data);font-size:11.5px;color:var(--ink-soft)}

/* Scala della carriera */
.ladder{list-style:none;margin:0 0 24px;padding:0;position:relative}
.ladder::before{
  content:"";position:absolute;left:51px;top:10px;bottom:10px;
  width:2px;background:var(--line);border-radius:2px;
}
.step{display:grid;grid-template-columns:44px 16px 1fr;align-items:start;gap:0 12px;padding:7px 0}
.years{
  font-family:var(--font-data);font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--ink-soft);text-align:right;padding-top:5px;line-height:1.3;
}
.years b{display:block;font-weight:700;color:var(--ink)}
.node{position:relative;width:16px;height:16px;margin-top:6px}
.node i{
  position:absolute;inset:3px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line);
}
.step.on .node i{background:var(--accent);border-color:var(--accent)}
.step.target .node i{background:var(--hot);border-color:var(--hot);inset:1px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;min-width:0;
}
.step.on .card{box-shadow:var(--shadow)}
.step.target .card{border-color:var(--hot);border-style:dashed}
.club{
  font-family:var(--font-display);font-variation-settings:'wdth' 108;
  font-weight:800;font-size:16px;line-height:1.2;letter-spacing:-.01em;
  text-transform:uppercase;overflow-wrap:anywhere;
}
.club.coperto{color:var(--ink-soft);letter-spacing:.22em;font-weight:700}
.club .pr{
  font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--warn);
  vertical-align:middle;margin-right:6px;
}
.statline{
  margin-top:3px;font-family:var(--font-data);font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-soft);
}
.statline em{font-style:normal;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion: no-preference){
  .step.on .card{animation:pop .36s cubic-bezier(.2,.8,.3,1) both}
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Indizi */
.clues{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.clue{
  display:flex;flex-direction:column;gap:1px;flex:1 1 150px;min-width:0;
  text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;
}
.clue:not(:disabled):hover{border-color:var(--accent)}
.clue small{
  font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);
}
.clue span{font-family:var(--font-display);font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.clue:disabled{cursor:default;opacity:1}
.clue.chiuso span{color:var(--ink-soft);font-weight:600;font-size:13px}
.clue.aperto{border-color:var(--accent);background:var(--surface-2)}

/* Tentativi */
.guesses{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:6px}
.guess{
  display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;
}
.guess .x{color:var(--hot);font-family:var(--font-data);font-weight:700;flex:none}
.guess .nm{min-width:0;overflow-wrap:anywhere}

/* Esito */
.result{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow);
}
.result.persa{border-left-color:var(--hot)}
.result h3{
  margin:0;font-family:var(--font-display);font-variation-settings:'wdth' 118;
  font-weight:800;font-size:clamp(19px,5vw,25px);line-height:1.1;
  text-transform:uppercase;letter-spacing:-.015em;text-wrap:balance;
}
.result p{margin:7px 0 0;font-family:var(--font-body);font-size:16px;color:var(--ink-soft)}
.result p b{color:var(--ink)}
.resultactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.btn{
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}

/* Archivio */
.archivio{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:6px}
.giorno{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 14px;
}
.giorno:hover{border-color:var(--accent)}
.giorno .data{
  font-family:var(--font-data);font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:700;white-space:nowrap;
}
.giorno .stato{font-size:12.5px;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere}
.giorno .stato b{font-weight:700}
.giorno .stato.vinta b{color:var(--ok)}
.giorno .stato.persa b{color:var(--hot)}
.giorno .freccia{color:var(--ink-soft);font-size:17px;line-height:1}
.giorno.oggi{border-color:var(--accent);box-shadow:var(--glow)}
.tornaindietro{
  display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;
  padding:0;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--ink-soft);
}
.tornaindietro:hover{color:var(--accent)}

/* Barra di gioco */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.dockinner{max-width:680px;margin:0 auto;position:relative}
.meter{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:9px;font-family:var(--font-data);font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-soft);
}
.pips{display:flex;gap:5px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.used{background:var(--hot)}
.score{font-weight:700;color:var(--ink)}

.field{position:relative}
.field input{
  width:100%;background:var(--surface);color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:16px;font-family:var(--font-ui);font-weight:500;
}
.field input::placeholder{color:var(--ink-soft);font-weight:400}
.field input:focus{border-color:var(--accent);outline:none}
.field input:disabled{opacity:.55}

.suggest{
  position:absolute;left:0;right:0;bottom:calc(100% + 7px);
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;max-height:260px;overflow-y:auto;
}
.suggest button{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:10px 14px;font-size:14.5px;font-weight:600;
}
.suggest button + button{border-top:1px solid var(--line)}
.suggest button[data-active="true"]{background:var(--surface-2);color:var(--accent)}
.suggest .vuoto{padding:11px 14px;color:var(--ink-soft);font-size:14px;font-family:var(--font-body)}

/* Modale */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(5,7,12,.6);
  display:flex;align-items:flex-end;justify-content:center;padding:16px;
}
@media (min-width:560px){.scrim{align-items:center}}
.modal{
  background:var(--bg);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:460px;max-height:84vh;overflow-y:auto;
  padding:20px;box-shadow:var(--shadow);
}
.modal h3{
  margin:0 0 4px;font-family:var(--font-display);font-variation-settings:'wdth' 115;
  font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:-.01em;
}
.modal p,.modal li{font-family:var(--font-body);font-size:15.5px;color:var(--ink-soft)}
.modal ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.modal p b,.modal li b{color:var(--ink)}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{
  display:block;font-family:var(--font-data);font-weight:700;font-size:20px;
  font-variant-numeric:tabular-nums;
}
.stat small{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:2px}

.bars{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.bar{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:8px;
  font-family:var(--font-data);font-size:11px}
.bar i{display:block;height:19px;border-radius:4px;background:var(--accent);
  min-width:22px;color:var(--accent-ink);font-weight:700;text-align:right;
  padding-right:6px;line-height:19px}

.foot{
  margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  font-family:var(--font-data);font-size:11px;color:var(--ink-soft);
}
.foot a{color:var(--accent);font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}

.tuttigiochi{
  display:block;width:100%;margin-top:18px;padding:13px 16px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  font-family:var(--font-display);font-variation-settings:'wdth' 108;
  font-weight:800;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
}
.tuttigiochi:hover{border-color:var(--accent);color:var(--accent)}

/* Incorporato in un iframe ad altezza automatica: niente scroll interno, quindi
   la barra di gioco torna nel flusso e la pagina ospite fa da contenitore. */
:root[data-incorporato],
:root[data-incorporato] body,
:root[data-incorporato] #root{height:auto;min-height:0}
:root[data-incorporato] .wrap{padding-bottom:20px}
:root[data-incorporato] .masthead{position:static}
:root[data-incorporato] .dock{position:static;border-top:0;padding:0 0 4px}
:root[data-incorporato] .scrim{align-items:flex-start;padding-top:20px}
